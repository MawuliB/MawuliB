# Generates the stats cards and contribution snake used in README.md.
# Self-hosting them avoids the rate limits and outages of the shared public instances.
name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

jobs:
  summary-cards:
    name: Stats cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 0
          THEME: dracula

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
